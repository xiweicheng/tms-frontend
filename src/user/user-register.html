<template>
    <require from="./user-register.css"></require>
    <div class="tms-user-register">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <h1 class="login-title">用户注册</h1>
                    <p class="login-subtitle">创建新账户，开始团队协作</p>
                </div>
                
                <div if.bind="!token" ref="fm" class="login-form">
                    <div class="form-message">
                        提交账户注册信息成功后，我们会向您的注册邮箱发送一封账户激活邮件，激活账户后即可登录！
                    </div>
                    
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </i>
                            <input type="text" name="username" autofocus="" value.bind="username" placeholder="用户名" class="form-input" />
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </i>
                            <input type="password" name="pwd" autofocus="" value.bind="pwd" placeholder="密码" class="form-input" />
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </i>
                            <input type="text" name="name" autofocus="" value.bind="name" placeholder="姓名" class="form-input" />
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </i>
                            <input type="text" name="mail" autofocus="" value.bind="mail" placeholder="邮箱" class="form-input" />
                        </div>
                    </div>
                    
                    <button click.delegate="okHandler()" class="login-button ${isReq ? 'disabled' : ''}">
                        <span class="button-text">确认注册</span>
                        <i class="button-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14"></path>
                                <path d="m12 5 7 7-7 7"></path>
                            </svg>
                        </i>
                    </button>
                    
                    <div class="login-footer">
                        <a href="#/login" class="login-link">已有账户？立即登录</a>
                    </div>
                </div>
                
                <div if.bind="token" class="login-form">
                    <div class="success-message">
                        <div class="success-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </div>
                        <h2 class="success-title">${header}</h2>
                        <a href="#/login" class="login-button secondary">
                            <span class="button-text">返回登录页面</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
